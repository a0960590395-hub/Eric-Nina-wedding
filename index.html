<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>梁期閔Eric & 洪琪毓Nina - Together, We Climb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --forest-green: #2d4a3e; }
        body { font-family: 'Noto Serif TC', serif; color: #374151; overflow-x: hidden; }
        h1, h2, h3, h4 { font-family: 'Cormorant Garamond', serif; font-weight: 700; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .no-wrap { white-space: nowrap; }
        .timer-card { background: white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 8px; }
        /* 確保手機文字不亂斷行 */
        .prevent-break { word-break: keep-all; white-space: nowrap; }
    </style>
</head>
<body class="bg-[#fcfbf9]">

    <nav class="fixed top-0 w-full z-50 glass border-b border-white/20">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <span class="text-sm md:text-lg font-bold tracking-widest text-[#2d4a3e] no-wrap">梁期閔Eric、洪琪毓Nina</span>
            <div class="flex space-x-4 md:space-x-8 text-[12px] md:text-sm font-bold tracking-wider">
                <a href="#about" class="hover:text-[#2d4a3e]">關於我們</a>
                <a href="#info" class="hover:text-[#2d4a3e]">資訊詳情</a>
                <a href="#rsvp" class="hover:text-[#2d4a3e]">出席回覆</a>
            </div>
        </div>
    </nav>

    <header id="about" class="relative h-screen w-full flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://i.postimg.cc/MGfxPW9J/LINE-ALBUM-hun-sha-260727-2.jpg'); background-attachment: fixed;"></div>
        <div class="absolute inset-0 bg-black/30"></div>
        <div class="relative z-10 text-center text-white px-4 flex flex-col items-center">
            <h1 class="text-5xl md:text-7xl mb-6 font-bold prevent-break">Together, We Climb</h1>
            <div class="text-sm md:text-xl font-medium space-y-2">
                <p class="prevent-break">從相遇、同行，到攜手走向未來，每一步都因為彼此而充滿意義。</p>
                <p class="text-lg md:text-2xl font-bold prevent-break">誠摯邀請您，與我們一同見證人生最美好的風景。</p>
            </div>
        </div>
    </header>

    <section id="info" class="py-20 px-6 max-w-4xl mx-auto">
        <h2 class="text-3xl text-center mb-12 text-[#2d4a3e]">好久不見，距離見面還有</h2>
        <div id="timer" class="flex justify-center items-center gap-2 md:gap-4 mb-20"></div>

        <div class="bg-white p-8 md:p-12 shadow-2xl rounded-2xl border border-gray-100">
            <div class="space-y-6 text-center">
                <h3 class="text-4xl text-[#2d4a3e]">活動資訊</h3>
                <p class="text-lg">日期：<span class="no-wrap">2026年11月22日 (六)</span></p>
                <p class="text-lg">時間：<span class="no-wrap">12:00 (建議 11:30 前抵達)</span></p>
                <p class="text-lg">地點：<span class="no-wrap">台中市林皇宮2F 墨緹絲廳</span></p>
                <p class="text-md text-gray-500"><span class="no-wrap">台中市西屯區臺灣大道三段33號</span></p>
                
                <button onclick="document.getElementById('map').classList.toggle('hidden')" class="mt-8 px-8 py-3 bg-[#2d4a3e] text-white rounded-full hover:bg-[#3d6353] transition shadow-lg">
                    檢視交通指引
                </button>
                <div id="map" class="hidden mt-6">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3640.669811400045!2d120.6418857!3d24.1627943!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x34693d8a571f28b7%3A0x6b42b93850117173!2z5Y-w5Lit5biC5p2-55qH5a6_!5e0!3m2!1szh-TW!2stw!4v1722086600000!5m2!1szh-TW!2stw" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" class="rounded-lg shadow-inner"></iframe>
                </div>
            </div>
        </div>

        <div class="mt-16 text-center">
            <a href="https://lin.ee/y1xDtCk" class="inline-block p-6 bg-[#06c755] text-white rounded-2xl hover:scale-105 transition duration-300 shadow-lg">
                <h4 class="font-bold text-lg md:text-xl m-0">加入line好友獲取更多當天活動資訊</h4>
            </a>
        </div>
    </section>

    <section id="rsvp" class="py-20 bg-gray-100">
        <div class="max-w-2xl mx-auto px-6">
            <h2 class="text-4xl text-center mb-12 text-[#2d4a3e]">出席回覆</h2>
            <div class="flex justify-center overflow-hidden rounded-2xl shadow-xl">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfDQI1j_SLHjUd1o1M6k_qQeuGAwL4UmK16wpcH4Hdasy2VRg/viewform?embedded=true" width="100%" height="1200" frameborder="0" marginheight="0" marginwidth="0">載入中…</iframe>
            </div>
            <p class="text-center mt-12 text-[#2d4a3e] font-bold text-xl">期閔&琪毓 期待見到您😉</p>
        </div>
    </section>

    <script>
        function updateTimer() {
            const target = new Date('2026-11-22T12:00:00');
            const now = new Date();
            const diff = target - now;
            
            if (diff <= 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);
            
            const units = [
                { val: days, label: '天' },
                { val: hours, label: '時' },
                { val: mins, label: '分' },
                { val: secs, label: '秒' }
            ];

            const container = document.getElementById('timer');
            container.innerHTML = units.map((u, i) => `
                <div class="flex flex-col items-center">
                    <div class="timer-card w-14 h-14 md:w-20 md:h-20 flex items-center justify-center text-lg md:text-3xl font-bold text-[#2d4a3e]">
                        ${String(u.val).padStart(2, '0')}
                    </div>
                    <span class="mt-2 text-[10px] md:text-xs text-gray-500 font-bold">${u.label}</span>
                </div>
                ${i < units.length - 1 ? '<div class="h-10 w-[1px] bg-gray-300 self-center mx-1"></div>' : ''}
            `).join('');
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
