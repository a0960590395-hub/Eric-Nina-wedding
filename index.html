<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>梁期閔Eric & 洪琪毓Nina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入指定的字體家族 -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Serif+TC:wght@400;600;700&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Serif TC', serif; 
            color: #2D4A3E; 
            background-color: #F8FAF9; 
        }
        h1, h2, h3, h4 { font-family: 'Cormorant Garamond', serif; }
        
        .handwriting { font-family: 'Dancing Script', cursive; }
        
        .nav-blur {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-color: rgba(248, 250, 249, 0.85);
            border-bottom: 1px solid rgba(45, 74, 62, 0.1);
        }
        
        .hero-section {
            width: 100%;
            height: 100vh;
            background-image: url('https://i.postimg.cc/MGfxPW9J/LINE-ALBUM-hun-sha-260727-2.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .hero-overlay {
            background: linear-gradient(to bottom, rgba(45, 74, 62, 0.2), rgba(45, 74, 62, 0.4));
        }

        .timer-card { background: #ffffff; box-shadow: 0 4px 15px rgba(45, 74, 62, 0.1); border-radius: 8px; border: 1px solid #E2E8E4; }
        .prevent-break { white-space: nowrap; display: inline-block; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 px-6 py-4 nav-blur">
        <span class="font-bold text-[#2D4A3E] text-lg tracking-wider">梁期閔Eric、洪琪毓Nina</span>
    </nav>

    <header class="hero-section flex items-center justify-center text-white hero-overlay">
        <div class="relative z-10 text-center px-4">
            <h1 class="font-eng text-5xl md:text-9xl mb-6 font-light leading-snug">Together <span class="text-3xl md:text-6xl">&amp;</span> We Climb</h1>
        </div>
    </header>

    <div class="text-xl md:text-3xl text-center font-medium space-y-4 mt-16 mb-20 px-6 text-[#2D4A3E] handwriting">
        <p>從相遇、同行，到攜手走向未來。</p>
        <p>每一步都因為彼此而充滿意義。</p>
        <p>誠摯邀請您，一同見證人生最美好的風景。</p>
    </div>    

    <section id="info" class="py-20 px-6 max-w-4xl mx-auto">
        <h2 class="text-4xl text-center mb-12 text-[#2D4A3E]">距離見面還有</h2>
        <div id="timer" class="flex justify-center items-center gap-2 md:gap-4 mb-20"></div>

        <div class="bg-white p-8 md:p-12 shadow-xl rounded-3xl border border-[#2D4A3E]/20">
            <div class="space-y-6 text-center text-[#2D4A3E]">
                <h3 class="text-4xl">資訊詳情</h3>
                <p class="text-lg">日期：<span class="prevent-break">2026年11月22日 (六)</span></p>
                <p class="text-lg">時間：<span class="prevent-break">12:00 (建議 11:30 前抵達)</span></p>
                <p class="text-lg">地點：<span class="prevent-break">台中市林皇宮2F 墨緹絲廳</span></p>
                <p class="text-md opacity-70"><span class="prevent-break">台中市西屯區臺灣大道三段33號</span></p>
                
                <button onclick="document.getElementById('map').classList.toggle('hidden')" class="mt-8 px-8 py-3 bg-[#2D4A3E] text-white rounded-full hover:bg-[#3d6353] transition shadow-lg">
                    檢視交通指引
                </button>
                <div id="map" class="hidden mt-6 overflow-hidden rounded-2xl shadow-inner">
                   <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3640.2589769120736!2d120.64580440869068!3d24.162648672739145!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x34693d8c2f21172f%3A0xc5fa8741cb3c07d7!2z5Y-w5Lit5p6X55qH5a6u!5e0!3m2!1szh-TW!2stw!4v1785170815454!5m2!1szh-TW!2stw" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
            </div>
        </div>
    </section>

    <section id="rsvp" class="py-20 bg-[#D7E0DC]">
        <div class="max-w-2xl mx-auto px-6">
            <h2 class="text-4xl text-center mb-12 text-[#2D4A3E]">出席回覆</h2>
            <div class="flex justify-center overflow-hidden rounded-2xl shadow-xl">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfDQI1j_SLHjUd1o1M6k_qQeuGAwL4UmK16wpcH4Hdasy2VRg/viewform?embedded=true" width="640" height="2961" frameborder="0" marginheight="0" marginwidth="0">載入中…</iframe>
            </div>
            <p class="text-center mt-12 text-[#2D4A3E] font-bold text-xl">期閔 & 琪毓 期待見到您 😉</p>
        </div>
    </section>

    <script>
        function updateTimer() {
            const target = new Date('2026-11-22T12:00:00');
            const now = new Date();
            const diff = target - now;
            if (diff <= 0) return;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);
            const units = [
                { val: days, label: '天' },
                { val: hours, label: '時' },
                { val: mins, label: '分' },
                { val: secs, label: '秒' }
            ];
            const container = document.getElementById('timer');
            container.innerHTML = units.map((u, i) => `
                <div class="flex flex-col items-center">
                    <div class="timer-card w-14 h-14 md:w-20 md:h-20 flex items-center justify-center text-lg md:text-3xl font-bold text-[#2D4A3E]">
                        ${String(u.val).padStart(2, '0')}
                    </div>
                    <span class="mt-2 text-[10px] md:text-xs text-[#2D4A3E] font-bold">${u.label}</span>
                </div>
                ${i < units.length - 1 ? '<div class="h-10 w-[1px] bg-[#2D4A3E]/30 self-center mx-1"></div>' : ''}
            `).join('');
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
