<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together, We Climb</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #F8FAF9;
            color: #1a2e26;
        }

        h1, h2, h3, .font-eng {
            font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
        }

        /* ✅ 手機高度修正（超重要） */
        .hero-section {
            width: 100%;
            min-height: 100dvh;
            background-image: url('https://i.postimg.cc/X7SWcgLL/IMG-1267.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 80px;
        }

        /* ✅ 文字緊密 */
        .tight-text {
            line-height: 1.4;
            letter-spacing: 0.05em;
        }

        .tight-title {
            line-height: 1.2;
            letter-spacing: 0.06em;
        }

        .tight-sub {
            line-height: 1.3;
        }

        /* navbar blur */
        .nav-blur {
            backdrop-filter: blur(12px);
            background: rgba(248,250,249,0.85);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>

<body>

<!-- ✅ Navbar -->
<nav class="fixed top-0 w-full z-50 px-6 py-4 nav-blur">
    <span class="font-bold text-lg tracking-wide">Together, We Climb</span>
</nav>

<!-- ✅ Hero -->
<header class="hero-section">

    <div class="bg-white/70 backdrop-blur-sm max-w-xl w-full p-6 sm:p-8 text-center rounded-t-2xl">

        <p class="tight-text text-sm sm:text-lg font-semibold mb-4">
            從相遇、相知，到同行走向未來<br>
            每一步都因為彼此而充滿意義
        </p>

        <h1 class="tight-title text-xl sm:text-2xl font-bold my-1 font-eng">
            梁期閔 Eric &amp; 洪琪毓 Nina
        </h1>

        <p class="tight-sub text-sm sm:text-lg font-semibold mt-2">
            期待，在這天與您相聚
        </p>

    </div>

</header>

<!-- ✅ Scroll -->
<div class="text-center my-10 text-sm opacity-60 tracking-widest">
    SCROLL
</div>

<!-- ✅ Info -->
<section class="py-16 px-6 max-w-3xl mx-auto">

    <h2 class="text-2xl text-center mb-10">好久不見，距離見面還有</h2>

    <div id="timer" class="flex justify-center gap-3 mb-16"></div>

    <div class="bg-white p-6 rounded-2xl shadow">

        <div class="text-center space-y-4">
            <h3 class="text-2xl">資訊詳情</h3>

            <p>日期：2026年11月22日（日）</p>
            <p>時間：12:00（建議 11:30 前抵達）</p>
            <p>地點：台中市林皇宮2F 墨緹絲廳</p>
            <p class="text-sm opacity-60">台中市西屯區臺灣大道三段33號</p>
        </div>

    </div>

</section>

<!-- ✅ Timer -->
<script>
function updateTimer() {
    const target = new Date('2026-11-22T12:00:00');
    const now = new Date();
    const diff = target - now;

    if (diff <= 0) return;

    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff / (1000*60*60)) % 24);
    const m = Math.floor((diff / (1000*60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    document.getElementById("timer").innerHTML = `
        <div>${d} 天</div>
        <div>${h} 時</div>
        <div>${m} 分</div>
        <div>${s} 秒</div>
    `;
}

setInterval(updateTimer,1000);
updateTimer();
</script>

</body>
</html>
